name: Sync Telegram to Lark
run-name: Sync Telegram to Lark (${{ github.event_name }})

on:
  schedule:
    # 播报时间约 00:20（GMT+8），此处 00:35（GMT+8）= 16:35 UTC，每日运行一次。
    - cron: '35 16 * * *'
  workflow_dispatch:  # 允许从 GitHub UI 手动触发
    inputs:
      backfill_from_message_id:
        description: '回补起始 Telegram message id（包含；留空则正常同步）'
        required: false
        type: string
      backfill_to_message_id:
        description: '回补结束 Telegram message id（包含；留空则不限制上限）'
        required: false
        type: string
      fetch_limit:
        description: '本次最多拉取多少条消息'
        required: false
        type: string
      lark_dedup_recent_n:
        description: '每张表读取多少条最近记录用于按日期去重'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-lark-sync
      cancel-in-progress: false
    permissions:
      contents: write  # 需要写权限以提交 last_message_id_nuworld.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          # Secrets（在 GitHub repo Settings → Secrets → Actions 中添加）
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          # Variables（在 GitHub repo Settings → Variables → Actions 中添加）
          NU_TG_GROUP_ID: ${{ vars.NU_TG_GROUP_ID }}
          NU_BOT_USERNAME: ${{ vars.NU_BOT_USERNAME }}
          NU_LARK_WIKI_NODE_TOKEN: ${{ vars.NU_LARK_WIKI_NODE_TOKEN }}
          NU_LARK_TABLE_ID: ${{ vars.NU_LARK_TABLE_ID }}
          # 手动触发时可覆盖的参数
          TG_FETCH_LIMIT: ${{ github.event.inputs.fetch_limit || '' }}
          BACKFILL_FROM_MESSAGE_ID: ${{ github.event.inputs.backfill_from_message_id || '' }}
          BACKFILL_TO_MESSAGE_ID: ${{ github.event.inputs.backfill_to_message_id || '' }}
          LARK_DEDUP_RECENT_N: ${{ github.event.inputs.lark_dedup_recent_n || '' }}
        run: python main.py

      - name: Commit updated state
        if: ${{ github.event_name == 'schedule' || (github.event.inputs.backfill_from_message_id == '' && github.event.inputs.backfill_to_message_id == '') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_message_id_nuworld.txt
          git diff --cached --quiet || git commit -m "chore: update last_message_id [skip ci]"
          git push
